  import os
    
    path = r"C:\AT_Project\demo_JavaSelenium\.github\workflows"
    file_path = os.path.join(path, "daily_run.yml")

                            content = """name: Daily Test Run

                            on:
                              schedule:
                                - cron: '0 3 * * *'
                              workflow_dispatch:

                            permissions:
                              contents: write
                              pages: write
                              id-token: write

                            jobs:
                              test-and-report:
                                runs-on: ubuntu-latest
                                steps:
                                  - name: Checkout code
                                    uses: actions/checkout@v4

                                  - name: Set up JDK 17
                                    uses: actions/setup-java@v3
                                    with:
                                      java-version: '17'
                                      distribution: 'temurin'
                                      cache: maven

                                  - name: Run tests
                                    run: mvn clean test

                                  - name: Generate Allure Report
                                    run: mvn allure:report

                                  - name: Deploy to GitHub Pages
                                    uses: peaceiris/actions-gh-pages@v3
                                    with:
                                      github_token: ${{ secrets.GITHUB_TOKEN }}
                                      publish_dir: ./target/site/allure-maven-plugin

                                  - name: Send email notification
                                    uses: dawidd6/action-send-mail@v3
                                    with:
                                      server_address: smtp.mail.ru
                                      server_port: 465
                                      username: ${{ secrets.MAIL_USERNAME }}
                                      password: ${{ secrets.MAIL_PASSWORD }}
                                      subject: "Результаты автотестов SauceDemo"
                                      to: terebok@mail.ru
                                      from: ${{ secrets.MAIL_USERNAME }}
                                      body: "Тесты завершены. Ссылка на отчет: https://terebok.github.io/demo_JavaSelenium/"
    """

with open(file_path, "w", encoding="utf-8") as f:
                              f.write(content)

                            print(f"created: {file_path}")